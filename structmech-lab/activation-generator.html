<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StructLab 激活码生成器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      min-height: 100vh;
    }
    .code-item {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="text-slate-200 p-8">
  <div class="max-w-2xl mx-auto">
    <!-- 标题 -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 mb-4 shadow-lg shadow-indigo-500/30">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">StructLab 激活码生成器</h1>
      <p class="text-slate-400">生成结构求解器模块的激活码</p>
    </div>

    <!-- 生成控制 -->
    <div class="bg-slate-800/60 backdrop-blur-sm rounded-2xl border border-slate-700/50 p-6 mb-6">
      <div class="flex items-center gap-4 mb-6">
        <div class="flex-1">
          <label class="block text-sm font-medium text-slate-300 mb-2">生成数量</label>
          <input type="number" id="count" value="5" min="1" max="100" 
            class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-xl text-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">
        </div>

      </div>
      
      <div class="flex gap-3">
        <button onclick="generateCodes()" 
          class="flex-1 py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 transition-all">
          生成激活码
        </button>
        <button onclick="copyAll()" 
          class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-xl transition-all">
          复制全部
        </button>
        <button onclick="exportCodes()" 
          class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-xl transition-all">
          导出
        </button>
      </div>
    </div>

    <!-- 生成的激活码列表 -->
    <div class="bg-slate-800/60 backdrop-blur-sm rounded-2xl border border-slate-700/50 p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-white">生成的激活码</h2>
        <span id="codeCount" class="text-sm text-slate-400">0 个</span>
      </div>
      
      <div id="codeList" class="space-y-2 max-h-96 overflow-y-auto">
        <p class="text-slate-500 text-center py-8">点击"生成激活码"开始</p>
      </div>
    </div>

    <!-- 使用说明 -->
    <div class="mt-6 bg-amber-500/10 border border-amber-500/20 rounded-xl p-4">
      <h3 class="text-amber-400 font-medium mb-2">💡 使用说明</h3>
      <ul class="text-sm text-slate-400 space-y-1">
        <li>• 生成的激活码可直接发送给用户使用</li>
        <li>• 激活码格式：XXXX-XXXX-XXXX-XXXX（大写字母和数字）</li>
        <li>• 每个激活码都包含校验信息，无需修改代码即可验证</li>
        <li>• 激活码不区分大小写</li>
      </ul>
    </div>
  </div>

  <script>
    let generatedCodes = [];

    function generateCode() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      
      // 生成前三段随机字符
      let parts = [];
      for (let s = 0; s < 3; s++) {
        let segment = '';
        for (let i = 0; i < 4; i++) {
          segment += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        parts.push(segment);
      }
      
      // 计算校验和生成第四段
      let checksum = 0;
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 4; j++) {
          checksum += chars.indexOf(parts[i][j]) * (i * 4 + j + 1);
        }
      }
      
      // 生成校验段
      const checkPart = [
        chars[(checksum * 7) % 36],
        chars[(checksum * 13) % 36],
        chars[(checksum * 17) % 36],
        chars[(checksum * 23) % 36]
      ].join('');
      
      parts.push(checkPart);
      return parts.join('-');
    }

    function generateCodes() {
      const count = parseInt(document.getElementById('count').value) || 5;
      
      generatedCodes = [];
      for (let i = 0; i < count; i++) {
        let code;
        do {
          code = generateCode();
        } while (generatedCodes.includes(code));
        generatedCodes.push(code);
      }

      renderCodes();
    }

    function renderCodes() {
      const list = document.getElementById('codeList');
      document.getElementById('codeCount').textContent = `${generatedCodes.length} 个`;
      
      if (generatedCodes.length === 0) {
        list.innerHTML = '<p class="text-slate-500 text-center py-8">点击"生成激活码"开始</p>';
        return;
      }

      list.innerHTML = generatedCodes.map((code, i) => `
        <div class="code-item flex items-center justify-between p-3 bg-slate-700/30 rounded-xl hover:bg-slate-700/50 transition-colors" style="animation-delay: ${i * 50}ms">
          <span class="font-mono text-lg text-indigo-300">${code}</span>
          <button onclick="copyCode('${code}')" class="px-3 py-1 text-sm bg-slate-600 hover:bg-slate-500 rounded-lg transition-colors">
            复制
          </button>
        </div>
      `).join('');
    }

    function updateSnippet() {
      const allCodes = [...generatedCodes];
      const snippet = `const VALID_ACTIVATION_CODES = [${allCodes.map(c => `'${c}'`).join(', ')}];`;
      document.getElementById('codeSnippet').textContent = snippet;
    }

    function copyCode(code) {
      navigator.clipboard.writeText(code).then(() => {
        showToast(`已复制: ${code}`);
      });
    }

    function copyAll() {
      if (generatedCodes.length === 0) {
        showToast('请先生成激活码');
        return;
      }
      navigator.clipboard.writeText(generatedCodes.join('\n')).then(() => {
        showToast(`已复制 ${generatedCodes.length} 个激活码`);
      });
    }

    function exportCodes() {
      if (generatedCodes.length === 0) {
        showToast('请先生成激活码');
        return;
      }
      const content = generatedCodes.join('\n');
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `activation-codes-${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 bg-green-600 text-white rounded-xl shadow-lg z-50';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }

    // 初始生成
    generateCodes();
  </script>
</body>
</html>
